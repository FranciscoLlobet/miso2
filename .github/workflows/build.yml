name: Zig build

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        lfs: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Setup Python Environment
      shell: bash
      run: |
        uv python install

    - name: Prepare Python Environment
      shell: bash
      run : |
        uv sync

    - name: Compile picolibx
      run: ./scripts/build-picolibc.sh
