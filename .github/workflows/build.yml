name: Zig build

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        lfs: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Setup Python Environment
      shell: bash
      run: |
        uv python install      

    - name: Prepare Python Environment
      shell: bash
      run : |
        uv sync

    - name: Install build deps
      shell: bash
      run : |
        sudo apt-get install -y gcc-arm-none-eabi clang-format meson

    - name: Compile picolibx
      run: ./scripts/build-picolibc.sh

    - name: Compile project
      run: uv run ziglang build
